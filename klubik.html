<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mikiho klubík</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a1025">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
body{font-family:'Helvetica Neue',system-ui,sans-serif;background:#1a1025;color:#f0eaf8;min-height:100vh;min-height:100dvh}

.header{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 12px;gap:10px}
.header-left{display:flex;align-items:center;gap:10px}
.back-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#f0eaf8;font-size:18px;cursor:pointer;text-decoration:none;flex-shrink:0}
.header-title{font-size:20px;font-weight:700;letter-spacing:-.01em}
.header-title span{color:#c084fc}
.edit-btn{background:rgba(255,255,255,.08);border:none;color:#c8b4f0;font-size:13px;font-weight:600;padding:7px 14px;border-radius:20px;cursor:pointer;flex-shrink:0}
.edit-btn.active{background:#c084fc;color:#1a1025}

.upload-wrap{padding:0 18px 18px}
.upload-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:16px;border:1.5px dashed rgba(192,132,252,.4);background:rgba(192,132,252,.06);color:#c084fc;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.upload-btn:active{opacity:.7}
#fileInput{display:none}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 18px 100px}

.vtile{background:#251535;border-radius:16px;overflow:hidden;cursor:pointer;position:relative;border:1.5px solid rgba(255,255,255,.06)}
.vtile:active{transform:scale(.97)}
.vtile-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0d0918}
.vtile-thumb-placeholder{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:32px;background:#0d0918}
.vtile-info{padding:10px 12px 12px}
.vtile-title{font-size:13px;font-weight:600;color:#f0eaf8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtile-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:18px;pointer-events:none}

.vtile-controls{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(15,8,24,.75);flex-direction:column;align-items:center;justify-content:center;gap:8px}
.vtile.edit-mode .vtile-controls{display:flex}
.vtile.edit-mode .vtile-play{display:none}
.vtile-order-btns{display:flex;gap:8px}
.order-btn{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.12);border:none;color:#f0eaf8;font-size:18px;cursor:pointer}
.order-btn:disabled{opacity:.25}
.delete-btn{background:rgba(239,68,68,.25);border:1px solid rgba(239,68,68,.4);color:#fca5a5;font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:inherit}
.rename-btn{background:rgba(255,255,255,.1);border:none;color:#c8b4f0;font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:inherit}

.empty{text-align:center;padding:60px 24px;color:rgba(240,234,248,.35)}
.empty-icon{font-size:52px;margin-bottom:14px}
.empty-text{font-size:15px;font-weight:500}
.empty-sub{font-size:13px;margin-top:6px;opacity:.7}

.player-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:9999;flex-direction:column;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0);-webkit-backface-visibility:hidden;isolation:isolate}
.player-overlay.open{display:flex}
.player-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(0,0,0,.6);position:absolute;top:0;left:0;right:0;z-index:1}
.player-title{font-size:14px;font-weight:600;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-close{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:16px;width:36px;height:36px;border-radius:50%;cursor:pointer;flex-shrink:0}
#playerVideo{width:100%;flex:1;min-height:0;object-fit:contain;-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform;opacity:.999}

.rename-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:150;align-items:center;justify-content:center;padding:24px}
.rename-overlay.open{display:flex}
.rename-box{background:#251535;border-radius:20px;padding:24px;width:100%;max-width:340px;border:1px solid rgba(255,255,255,.1)}
.rename-label{font-size:13px;color:#c8b4f0;margin-bottom:10px;font-weight:600}
.rename-input{width:100%;background:#1a1025;border:1.5px solid rgba(192,132,252,.4);border-radius:10px;color:#f0eaf8;font-size:15px;padding:10px 12px;font-family:inherit;outline:none}
.rename-input:focus{border-color:#c084fc}
.rename-btns{display:flex;gap:8px;margin-top:14px}
.rename-ok{flex:1;background:#c084fc;color:#1a1025;border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.rename-cancel{flex:1;background:rgba(255,255,255,.08);color:#c8b4f0;border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

.progress-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.progress-overlay.open{display:flex}
.progress-text{color:#f0eaf8;font-size:14px;font-weight:600}
.progress-bar-wrap{width:220px;height:6px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.progress-bar{height:100%;background:#c084fc;border-radius:6px;transition:width .15s}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#f0eaf8;color:#1a1025;font-size:13px;font-weight:600;padding:10px 20px;border-radius:100px;opacity:0;transition:opacity .2s,transform .25s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.thumb-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:200;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.thumb-overlay.open{display:flex}
.thumb-video{width:100%;max-width:560px;border-radius:10px;background:#000;display:block}
.thumb-label{color:#c8b4f0;font-size:13px;font-weight:600;align-self:flex-start;max-width:560px;width:100%}
.thumb-slider{width:100%;max-width:560px;accent-color:#c084fc}
.thumb-btns{display:flex;gap:10px;width:100%;max-width:560px}
.thumb-ok{flex:1;background:#c084fc;color:#1a1025;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.thumb-cancel{flex:1;background:rgba(255,255,255,.08);color:#c8b4f0;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <a class="back-btn" href="index.html">‹</a>
    <div class="header-title">Mikiho <span>klubík</span></div>
  </div>
  <button class="edit-btn" id="editBtn" onclick="toggleEdit()">Upravit</button>
</div>

<div class="upload-wrap">
  <label class="upload-btn" for="fileInput">＋ Přidat video</label>
  <input type="file" id="fileInput" accept="video/*" multiple>
</div>

<div class="grid" id="grid"></div>

<div class="player-overlay" id="playerOverlay">
  <div class="player-bar">
    <div class="player-title" id="playerTitle"></div>
    <button class="player-close" onclick="closePlayer()">✕</button>
  </div>
  <video id="playerVideo" controls playsinline webkit-playsinline></video>
</div>

<div class="rename-overlay" id="renameOverlay">
  <div class="rename-box">
    <div class="rename-label">Přejmenovat video</div>
    <input class="rename-input" id="renameInput" type="text">
    <div class="rename-btns">
      <button class="rename-cancel" onclick="closeRename()">Zrušit</button>
      <button class="rename-ok" onclick="confirmRename()">Uložit</button>
    </div>
  </div>
</div>

<div class="progress-overlay" id="progressOverlay">
  <div class="progress-text" id="progressText">Nahrávám…</div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
</div>

<div class="thumb-overlay" id="thumbOverlay">
  <div class="thumb-label" id="thumbLabel">Vyber snímek pro náhled</div>
  <video class="thumb-video" id="thumbVideo" muted playsinline preload="auto" crossorigin="anonymous"></video>
  <input class="thumb-slider" type="range" id="thumbSlider" min="0" max="100" value="0" step="0.1">
  <div class="thumb-btns">
    <button class="thumb-cancel" onclick="closeThumbPicker()">Zrušit</button>
    <button class="thumb-ok" onclick="confirmThumb()">Použít tento snímek</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const SUPABASE_URL      = 'https://kwwbltwrkfaqvntoqskt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3d2JsdHdya2ZhcXZudG9xc2t0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyOTU5NjUsImV4cCI6MjA4OTg3MTk2NX0.DaKoPRUB1_WUhwdqumb5OPtDDwJ8wi6HEJYQCYdEA1M';
const BUCKET = 'videos';

let videos = [], editMode = false, renameId = null;

// ── API helpers ────────────────────────────────────────
const headers = {'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json'};

async function dbGet(path){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {headers});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbPost(path, body){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {method:'POST', headers:{...headers,'Prefer':'return=representation'}, body: JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbPatch(path, body){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {method:'PATCH', headers, body: JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
}
async function dbDelete(path){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {method:'DELETE', headers});
  if(!r.ok) throw new Error(await r.text());
}

async function storageUpload(path, file, onProgress){
  return new Promise((res, rej) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`);
    xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Authorization', `Bearer ${SUPABASE_ANON_KEY}`);
    xhr.upload.onprogress = e => { if(e.lengthComputable) onProgress(e.loaded/e.total); };
    xhr.onload = () => xhr.status < 300 ? res() : rej(new Error(xhr.responseText));
    xhr.onerror = () => rej(new Error('Upload selhal'));
    xhr.send(file);
  });
}

async function storageDelete(path){
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}`, {
    method:'DELETE',
    headers: {...headers, 'Content-Type':'application/json'},
    body: JSON.stringify({prefixes:[path]})
  });
  if(!r.ok) throw new Error(await r.text());
}

function videoPublicUrl(path){
  return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
}

// ── Thumbnail ──────────────────────────────────────────
function generateThumb(file){
  return new Promise(res => {
    const url = URL.createObjectURL(file);
    const video = document.createElement('video');
    video.muted = true; video.playsInline = true; video.preload = 'metadata'; video.src = url;
    video.addEventListener('loadedmetadata', () => { video.currentTime = Math.min(10, video.duration * 0.2); });
    video.addEventListener('seeked', () => {
      setTimeout(() => {
        const canvas = document.createElement('canvas');
        canvas.width = 320; canvas.height = 180;
        canvas.getContext('2d').drawImage(video, 0, 0, 320, 180);
        URL.revokeObjectURL(url);
        res(canvas.toDataURL('image/jpeg', 0.6));
      }, 200);
    });
    video.addEventListener('error', () => { URL.revokeObjectURL(url); res(null); });
  });
}

// ── Upload ─────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  if(!files.length) return;
  e.target.value = '';

  for(let i = 0; i < files.length; i++){
    const file = files[i];
    const name = file.name.replace(/\.[^.]+$/, '');
    showProgress(`Nahrávám ${i+1}/${files.length}…`, 0);

    try {
      const thumb = await generateThumb(file);
      const safeName = file.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9._-]/g,'_');
      const path = `${Date.now()}_${Math.random().toString(36).slice(2)}_${safeName}`;
      await storageUpload(path, file, p => setProgress(Math.round(p * 90)));
      const rows = await dbPost('video_items', {name, storage_path: path, thumbnail: thumb, order: videos.length});
      const row = Array.isArray(rows) ? rows[0] : rows;
      videos.push(row);
      setProgress(100);
    } catch(err) {
      hideProgress();
      showToast('Chyba při nahrávání: ' + err.message);
      return;
    }
  }

  hideProgress();
  renderGrid();
  showToast(files.length > 1 ? `Přidáno ${files.length} videí` : 'Video přidáno');
});

// ── Render ─────────────────────────────────────────────
function renderGrid(){
  const grid = document.getElementById('grid');
  videos.sort((a,b) => a.order - b.order);
  if(!videos.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">🎬</div>
      <div class="empty-text">Žádná videa</div>
      <div class="empty-sub">Klikni na „Přidat video"</div>
    </div>`;
    return;
  }
  grid.innerHTML = videos.map((v,i) => `
    <div class="vtile${editMode?' edit-mode':''}" onclick="${editMode ? '' : `playVideo('${v.id}')`}">
      ${v.thumbnail
        ? `<img class="vtile-thumb" src="${v.thumbnail}" loading="lazy">`
        : `<div class="vtile-thumb-placeholder">🎬</div>`}
      ${!editMode ? `<div class="vtile-play">▶</div>` : ''}
      <div class="vtile-info"><div class="vtile-title">${escHtml(v.name)}</div></div>
      <div class="vtile-controls">
        <div class="vtile-order-btns">
          <button class="order-btn" onclick="event.stopPropagation();moveVideo('${v.id}',-1)" ${i===0?'disabled':''}>◀</button>
          <button class="order-btn" onclick="event.stopPropagation();moveVideo('${v.id}',1)" ${i===videos.length-1?'disabled':''}>▶</button>
        </div>
        <button class="rename-btn" onclick="event.stopPropagation();openRename('${v.id}')">Přejmenovat</button>
        <button class="rename-btn" onclick="event.stopPropagation();openThumbPicker('${v.id}')">Náhled</button>
        <button class="delete-btn" onclick="event.stopPropagation();deleteVideo('${v.id}')">Smazat</button>
      </div>
    </div>
  `).join('');
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Edit mode ──────────────────────────────────────────
function toggleEdit(){
  editMode = !editMode;
  const btn = document.getElementById('editBtn');
  btn.textContent = editMode ? 'Hotovo' : 'Upravit';
  btn.classList.toggle('active', editMode);
  renderGrid();
}

// ── Move ───────────────────────────────────────────────
async function moveVideo(id, dir){
  const idx = videos.findIndex(v => v.id === id);
  const swapIdx = idx + dir;
  if(swapIdx < 0 || swapIdx >= videos.length) return;
  const tmp = videos[idx].order;
  videos[idx].order = videos[swapIdx].order;
  videos[swapIdx].order = tmp;
  await dbPatch(`video_items?id=eq.${videos[idx].id}`, {order: videos[idx].order});
  await dbPatch(`video_items?id=eq.${videos[swapIdx].id}`, {order: videos[swapIdx].order});
  videos.sort((a,b) => a.order - b.order);
  renderGrid();
}

// ── Delete ─────────────────────────────────────────────
async function deleteVideo(id){
  if(!confirm('Smazat toto video?')) return;
  const v = videos.find(v => v.id === id);
  if(!v) return;
  try {
    await storageDelete(v.storage_path);
    await dbDelete(`video_items?id=eq.${id}`);
    videos = videos.filter(v => v.id !== id);
    for(let i=0; i<videos.length; i++){
      videos[i].order = i;
      await dbPatch(`video_items?id=eq.${videos[i].id}`, {order: i});
    }
    renderGrid();
    showToast('Video smazáno');
  } catch(err) {
    showToast('Chyba při mazání');
  }
}

// ── Rename ─────────────────────────────────────────────
function openRename(id){
  renameId = id;
  const v = videos.find(v => v.id === id);
  document.getElementById('renameInput').value = v ? v.name : '';
  document.getElementById('renameOverlay').classList.add('open');
  setTimeout(() => document.getElementById('renameInput').focus(), 50);
}
function closeRename(){ document.getElementById('renameOverlay').classList.remove('open'); renameId = null; }
let thumbPickerId = null;

function openThumbPicker(id){
  thumbPickerId = id;
  const overlay = document.getElementById('thumbOverlay');
  const video = document.getElementById('thumbVideo');
  const slider = document.getElementById('thumbSlider');
  const item = videos.find(v => v.id === id);
  if(!item) return;
  const url = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${item.storage_path}`;
  video.src = url;
  video.load();
  video.addEventListener('loadedmetadata', function onMeta(){
    slider.max = Math.floor(video.duration);
    slider.value = 0;
  }, {once: true});
  slider.oninput = () => {
    video.currentTime = parseFloat(slider.value);
  };
  overlay.style.display = 'flex';
}

function closeThumbPicker(){
  const overlay = document.getElementById('thumbOverlay');
  const video = document.getElementById('thumbVideo');
  overlay.style.display = 'none';
  video.pause();
  video.src = '';
  thumbPickerId = null;
}

async function confirmThumb(){
  const video = document.getElementById('thumbVideo');
  try{
    // wait for current seek to finish before capturing
    await new Promise(res => {
      if(video.seeking){ video.addEventListener('seeked', res, {once:true}); }
      else { res(); }
    });
    await new Promise(res => setTimeout(res, 100));
    if(!video.videoWidth || !video.videoHeight){
      toast('Video ještě není načtené, zkus to znovu');
      return;
    }
    const canvas = document.createElement('canvas');
    canvas.width = 320; canvas.height = 180;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, 320, 180);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
    const savedId = thumbPickerId;
    await dbPatch(`video_items?id=eq.${savedId}`, {thumbnail: dataUrl});
    const item = videos.find(v => v.id === savedId);
    if(item){ item.thumbnail = dataUrl; renderList(); }
    toast('Náhled uložen');
    closeThumbPicker();
  }catch(err){
    console.error('confirmThumb error', err);
    toast('Chyba při uložení náhledu: ' + (err.message || err));
  }
}

async function confirmRename(){
  if(!renameId) return;
  const name = document.getElementById('renameInput').value.trim();
  if(!name){ closeRename(); return; }
  try {
    await dbPatch(`video_items?id=eq.${renameId}`, {name});
    const v = videos.find(v => v.id === renameId);
    if(v) v.name = name;
    closeRename();
    renderGrid();
  } catch(err) {
    showToast('Chyba při přejmenování');
  }
}
document.getElementById('renameInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') confirmRename();
  if(e.key === 'Escape') closeRename();
});

// ── Player ─────────────────────────────────────────────
function playVideo(id){
  const v = videos.find(v => v.id === id);
  if(!v) return;
  const url = videoPublicUrl(v.storage_path);
  const player = document.getElementById('playerVideo');
  player.src = url;
  document.getElementById('playerTitle').textContent = v.name;
  document.getElementById('playerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  player.play().catch(() => {});
}
function closePlayer(){
  const player = document.getElementById('playerVideo');
  player.pause();
  player.src = '';
  document.getElementById('playerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ── Toast ──────────────────────────────────────────────
let toastT;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400);
}

// ── Progress ───────────────────────────────────────────
function showProgress(msg, pct){ document.getElementById('progressText').textContent=msg; document.getElementById('progressBar').style.width=pct+'%'; document.getElementById('progressOverlay').classList.add('open'); }
function setProgress(pct){ document.getElementById('progressBar').style.width=pct+'%'; }
function hideProgress(){ document.getElementById('progressOverlay').classList.remove('open'); }

// ── Init ───────────────────────────────────────────────
async function init(){
  try {
    const data = await dbGet('video_items?select=*&order=order.asc');
    videos = data || [];
  } catch(err) {
    showToast('Chyba načítání');
  }
  renderGrid();
}
