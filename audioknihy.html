<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Audioknihy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f1a25">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
body{font-family:'Helvetica Neue',system-ui,sans-serif;background:#0f1a25;color:#eaf2f0;min-height:100vh;min-height:100dvh}

.header{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 12px;gap:10px}
.header-left{display:flex;align-items:center;gap:10px}
.back-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#eaf2f0;font-size:18px;cursor:pointer;text-decoration:none;flex-shrink:0}
.header-title{font-size:20px;font-weight:700;letter-spacing:-.01em}
.header-title span{color:#5eb8a8}
.edit-btn{background:rgba(255,255,255,.08);border:none;color:#9fd8cc;font-size:13px;font-weight:600;padding:7px 14px;border-radius:20px;cursor:pointer;flex-shrink:0}
.edit-btn.active{background:#5eb8a8;color:#0f1a25}

.upload-wrap{padding:0 18px 18px}
.upload-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:16px;border:1.5px dashed rgba(94,184,168,.4);background:rgba(94,184,168,.06);color:#5eb8a8;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.upload-btn:active{opacity:.7}
#fileInput{display:none}

.list{display:flex;flex-direction:column;gap:10px;padding:0 18px 140px}

.atile{background:#182636;border-radius:16px;overflow:hidden;cursor:pointer;position:relative;border:1.5px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px;padding:12px}
.atile:active{transform:scale(.98)}
.atile-icon{width:48px;height:48px;border-radius:12px;background:#0d1520;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.atile-icon.playing{background:#5eb8a8;color:#0f1a25}
.atile-info{flex:1;min-width:0}
.atile-title{font-size:14px;font-weight:600;color:#eaf2f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atile-sub{font-size:12px;color:rgba(234,242,240,.5);margin-top:2px}

.atile-controls{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(13,17,26,.9);align-items:center;justify-content:center;gap:8px}
.atile.edit-mode .atile-controls{display:flex}
.order-btn{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.12);border:none;color:#eaf2f0;font-size:18px;cursor:pointer}
.order-btn:disabled{opacity:.25}
.delete-btn{background:rgba(239,68,68,.25);border:1px solid rgba(239,68,68,.4);color:#fca5a5;font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:inherit}
.rename-btn{background:rgba(255,255,255,.1);border:none;color:#9fd8cc;font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:inherit}

.empty{text-align:center;padding:60px 24px;color:rgba(234,242,240,.35)}
.empty-icon{font-size:52px;margin-bottom:14px}
.empty-text{font-size:15px;font-weight:500}
.empty-sub{font-size:13px;margin-top:6px;opacity:.7}

/* Mini player pevně dole */
.player-bar{display:none;position:fixed;left:0;right:0;bottom:0;background:#182636;border-top:1px solid rgba(255,255,255,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:9999;flex-direction:column;gap:8px;-webkit-transform:translateZ(0);transform:translateZ(0)}
.player-bar.open{display:flex}
.player-row{display:flex;align-items:center;gap:12px}
.player-title{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-btn{background:rgba(255,255,255,.1);border:none;color:#eaf2f0;font-size:18px;width:40px;height:40px;border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.player-btn.play{background:#5eb8a8;color:#0f1a25}
.player-seek{width:100%;accent-color:#5eb8a8}
.player-time{font-size:11px;color:rgba(234,242,240,.5);display:flex;justify-content:space-between}

.rename-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:150;align-items:center;justify-content:center;padding:24px}
.rename-overlay.open{display:flex}
.rename-box{background:#182636;border-radius:20px;padding:24px;width:100%;max-width:340px;border:1px solid rgba(255,255,255,.1)}
.rename-label{font-size:13px;color:#9fd8cc;margin-bottom:10px;font-weight:600}
.rename-input{width:100%;background:#0f1a25;border:1.5px solid rgba(94,184,168,.4);border-radius:10px;color:#eaf2f0;font-size:15px;padding:10px 12px;font-family:inherit;outline:none}
.rename-input:focus{border-color:#5eb8a8}
.rename-btns{display:flex;gap:8px;margin-top:14px}
.rename-ok{flex:1;background:#5eb8a8;color:#0f1a25;border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.rename-cancel{flex:1;background:rgba(255,255,255,.08);color:#9fd8cc;border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

.progress-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.progress-overlay.open{display:flex}
.progress-text{color:#eaf2f0;font-size:14px;font-weight:600}
.progress-bar-wrap{width:220px;height:6px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.progress-bar{height:100%;background:#5eb8a8;border-radius:6px;transition:width .15s}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#eaf2f0;color:#0f1a25;font-size:13px;font-weight:600;padding:10px 20px;border-radius:100px;opacity:0;transition:opacity .2s,transform .25s;pointer-events:none;z-index:400;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <a class="back-btn" href="index.html">‹</a>
    <div class="header-title">Audio<span>knihy</span></div>
  </div>
  <button class="edit-btn" id="editBtn" onclick="toggleEdit()">Upravit</button>
</div>

<div class="upload-wrap">
  <label class="upload-btn" for="fileInput">＋ Přidat audioknihu</label>
  <input type="file" id="fileInput" accept="audio/*" multiple>
</div>

<div class="list" id="list"></div>

<div class="player-bar" id="playerBar">
  <div class="player-row">
    <button class="player-btn" onclick="skip(-15)">«15</button>
    <button class="player-btn play" id="playBtn" onclick="togglePlay()">▶</button>
    <button class="player-btn" onclick="skip(30)">30»</button>
    <div class="player-title" id="playerTitle"></div>
  </div>
  <input class="player-seek" type="range" id="playerSeek" min="0" max="100" value="0" step="0.1">
  <div class="player-time">
    <span id="playerCur">0:00</span>
    <span id="playerDur">0:00</span>
  </div>
</div>

<div class="rename-overlay" id="renameOverlay">
  <div class="rename-box">
    <div class="rename-label">Přejmenovat audioknihu</div>
    <input class="rename-input" id="renameInput" type="text">
    <div class="rename-btns">
      <button class="rename-cancel" onclick="closeRename()">Zrušit</button>
      <button class="rename-ok" onclick="confirmRename()">Uložit</button>
    </div>
  </div>
</div>

<div class="progress-overlay" id="progressOverlay">
  <div class="progress-text" id="progressText">Nahrávám…</div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
</div>

<div class="toast" id="toast"></div>

<audio id="audioPlayer" preload="metadata"></audio>

<script>
'use strict';

const SUPABASE_URL      = 'https://kwwbltwrkfaqvntoqskt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3d2JsdHdya2ZhcXZudG9xc2t0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyOTU5NjUsImV4cCI6MjA4OTg3MTk2NX0.DaKoPRUB1_WUhwdqumb5OPtDDwJ8wi6HEJYQCYdEA1M';
const BUCKET = 'audiobooks';

let books = [], editMode = false, renameId = null, currentId = null;

// ── API helpers ────────────────────────────────────────
const headers = {'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json'};

async function dbGet(path){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {headers});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbPost(path, body){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {method:'POST', headers:{...headers,'Prefer':'return=representation'}, body: JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbPatch(path, body){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {method:'PATCH', headers, body: JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
}
async function dbDelete(path){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {method:'DELETE', headers});
  if(!r.ok) throw new Error(await r.text());
}

async function storageUpload(path, file, onProgress){
  return new Promise((res, rej) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`);
    xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Authorization', `Bearer ${SUPABASE_ANON_KEY}`);
    xhr.upload.onprogress = e => { if(e.lengthComputable) onProgress(e.loaded/e.total); };
    xhr.onload = () => xhr.status < 300 ? res() : rej(new Error(xhr.responseText));
    xhr.onerror = () => rej(new Error('Upload selhal'));
    xhr.send(file);
  });
}

async function storageDelete(path){
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}`, {
    method:'DELETE',
    headers: {...headers, 'Content-Type':'application/json'},
    body: JSON.stringify({prefixes:[path]})
  });
  if(!r.ok) throw new Error(await r.text());
}

function audioPublicUrl(path){
  return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function formatTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

// ── Upload ─────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  if(!files.length) return;
  e.target.value = '';

  for(let i = 0; i < files.length; i++){
    const file = files[i];
    const name = file.name.replace(/\.[^.]+$/, '');
    showProgress(`Nahrávám ${i+1}/${files.length}…`, 0);

    try {
      const safeName = file.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9._-]/g,'_');
      const path = `${Date.now()}_${Math.random().toString(36).slice(2)}_${safeName}`;
      await storageUpload(path, file, p => setProgress(Math.round(p * 100)));
      const rows = await dbPost('audio_items', {name, storage_path: path, order: books.length, position: 0});
      const row = Array.isArray(rows) ? rows[0] : rows;
      books.push(row);
      setProgress(100);
    } catch(err) {
      hideProgress();
      showToast('Chyba při nahrávání: ' + err.message);
      return;
    }
  }

  hideProgress();
  renderList();
  showToast(files.length > 1 ? `Přidáno ${files.length} audioknih` : 'Audiokniha přidána');
});

// ── Render ─────────────────────────────────────────────
function renderList(){
  const list = document.getElementById('list');
  books.sort((a,b) => a.order - b.order);
  if(!books.length){
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">🎧</div>
      <div class="empty-text">Žádné audioknihy</div>
      <div class="empty-sub">Klikni na „Přidat audioknihu"</div>
    </div>`;
    return;
  }
  list.innerHTML = books.map((b,i) => `
    <div class="atile${editMode?' edit-mode':''}" onclick="${editMode ? '' : `playBook('${b.id}')`}">
      <div class="atile-icon${currentId===b.id?' playing':''}">${currentId===b.id ? '♪' : '🎧'}</div>
      <div class="atile-info">
        <div class="atile-title">${escHtml(b.name)}</div>
        <div class="atile-sub">${b.position ? formatTime(b.position) + ' odposloucháno' : 'Nezačato'}</div>
      </div>
      <div class="atile-controls">
        <button class="order-btn" onclick="event.stopPropagation();moveBook('${b.id}',-1)" ${i===0?'disabled':''}>▲</button>
        <button class="order-btn" onclick="event.stopPropagation();moveBook('${b.id}',1)" ${i===books.length-1?'disabled':''}>▼</button>
        <button class="rename-btn" onclick="event.stopPropagation();openRename('${b.id}')">Přejmenovat</button>
        <button class="delete-btn" onclick="event.stopPropagation();deleteBook('${b.id}')">Smazat</button>
      </div>
    </div>
  `).join('');
}

// ── Edit mode ──────────────────────────────────────────
function toggleEdit(){
  editMode = !editMode;
  const btn = document.getElementById('editBtn');
  btn.textContent = editMode ? 'Hotovo' : 'Upravit';
  btn.classList.toggle('active', editMode);
  renderList();
}

// ── Move ───────────────────────────────────────────────
async function moveBook(id, dir){
  const idx = books.findIndex(b => b.id === id);
  const swapIdx = idx + dir;
  if(swapIdx < 0 || swapIdx >= books.length) return;
  const tmp = books[idx].order;
  books[idx].order = books[swapIdx].order;
  books[swapIdx].order = tmp;
  await dbPatch(`audio_items?id=eq.${books[idx].id}`, {order: books[idx].order});
  await dbPatch(`audio_items?id=eq.${books[swapIdx].id}`, {order: books[swapIdx].order});
  books.sort((a,b) => a.order - b.order);
  renderList();
}

// ── Delete ─────────────────────────────────────────────
async function deleteBook(id){
  if(!confirm('Smazat tuto audioknihu?')) return;
  const b = books.find(b => b.id === id);
  if(!b) return;
  try {
    if(currentId === id) stopPlayback();
    await storageDelete(b.storage_path);
    await dbDelete(`audio_items?id=eq.${id}`);
    books = books.filter(b => b.id !== id);
    for(let i=0; i<books.length; i++){
      books[i].order = i;
      await dbPatch(`audio_items?id=eq.${books[i].id}`, {order: i});
    }
    renderList();
    showToast('Audiokniha smazána');
  } catch(err) {
    showToast('Chyba při mazání');
  }
}

// ── Rename ─────────────────────────────────────────────
function openRename(id){
  renameId = id;
  const b = books.find(b => b.id === id);
  document.getElementById('renameInput').value = b ? b.name : '';
  document.getElementById('renameOverlay').classList.add('open');
  setTimeout(() => document.getElementById('renameInput').focus(), 50);
}
function closeRename(){ document.getElementById('renameOverlay').classList.remove('open'); renameId = null; }

async function confirmRename(){
  if(!renameId) return;
  const name = document.getElementById('renameInput').value.trim();
  if(!name){ closeRename(); return; }
  try {
    await dbPatch(`audio_items?id=eq.${renameId}`, {name});
    const b = books.find(b => b.id === renameId);
    if(b) b.name = name;
    closeRename();
    renderList();
    if(currentId === renameId) updateMediaSessionMeta();
  } catch(err) {
    showToast('Chyba při přejmenování');
  }
}
document.getElementById('renameInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') confirmRename();
  if(e.key === 'Escape') closeRename();
});

// ── Player ─────────────────────────────────────────────
const player = document.getElementById('audioPlayer');
let saveTimer = null;

function playBook(id){
  const b = books.find(b => b.id === id);
  if(!b) return;
  const isSame = currentId === id;
  currentId = id;
  if(!isSame){
    player.src = audioPublicUrl(b.storage_path);
    player.addEventListener('loadedmetadata', function onMeta(){
      if(b.position) player.currentTime = b.position;
      player.removeEventListener('loadedmetadata', onMeta);
    }, {once:true});
  }
  document.getElementById('playerTitle').textContent = b.name;
  document.getElementById('playerBar').classList.add('open');
  player.play().catch(()=>{});
  updateMediaSessionMeta();
  renderList();
}

function togglePlay(){
  if(!currentId) return;
  if(player.paused) player.play().catch(()=>{});
  else player.pause();
}

function skip(sec){
  if(!currentId) return;
  player.currentTime = Math.max(0, Math.min(player.duration || 0, player.currentTime + sec));
}

function stopPlayback(){
  player.pause();
  player.src = '';
  currentId = null;
  document.getElementById('playerBar').classList.remove('open');
}

player.addEventListener('play', () => {
  document.getElementById('playBtn').textContent = '⏸';
  if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
player.addEventListener('pause', () => {
  document.getElementById('playBtn').textContent = '▶';
  if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
});
player.addEventListener('timeupdate', () => {
  if(!player.duration) return;
  document.getElementById('playerSeek').value = (player.currentTime / player.duration) * 100;
  document.getElementById('playerCur').textContent = formatTime(player.currentTime);
  document.getElementById('playerDur').textContent = formatTime(player.duration);
  if('mediaSession' in navigator && navigator.mediaSession.setPositionState){
    try {
      navigator.mediaSession.setPositionState({
        duration: player.duration,
        playbackRate: player.playbackRate,
        position: player.currentTime
      });
    } catch(e){}
  }
  // Ulož pozici max 1x za 5s
  if(currentId){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const b = books.find(b => b.id === currentId);
      if(b){ b.position = Math.floor(player.currentTime); dbPatch(`audio_items?id=eq.${currentId}`, {position: b.position}).catch(()=>{}); }
    }, 5000);
  }
});
player.addEventListener('ended', () => {
  if(currentId){
    const b = books.find(b => b.id === currentId);
    if(b){ b.position = 0; dbPatch(`audio_items?id=eq.${currentId}`, {position: 0}).catch(()=>{}); }
  }
  renderList();
});

document.getElementById('playerSeek').addEventListener('input', e => {
  if(!player.duration) return;
  player.currentTime = (parseFloat(e.target.value) / 100) * player.duration;
});

function updateMediaSessionMeta(){
  if(!('mediaSession' in navigator) || !currentId) return;
  const b = books.find(b => b.id === currentId);
  if(!b) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: b.name,
    artist: 'Audioknihy',
    album: 'Mikiho klubík'
  });
}

if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play', () => player.play().catch(()=>{}));
  navigator.mediaSession.setActionHandler('pause', () => player.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => skip(-15));
  navigator.mediaSession.setActionHandler('seekforward', () => skip(30));
  navigator.mediaSession.setActionHandler('seekto', d => { if(d.seekTime != null) player.currentTime = d.seekTime; });
}

// ── Toast ──────────────────────────────────────────────
let toastT;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400);
}

// ── Progress ───────────────────────────────────────────
function showProgress(msg, pct){ document.getElementById('progressText').textContent=msg; document.getElementById('progressBar').style.width=pct+'%'; document.getElementById('progressOverlay').classList.add('open'); }
function setProgress(pct){ document.getElementById('progressBar').style.width=pct+'%'; }
function hideProgress(){ document.getElementById('progressOverlay').classList.remove('open'); }

// ── Init ───────────────────────────────────────────────
async function init(){
  try {
    const data = await dbGet('audio_items?select=*&order=order.asc');
    books = data || [];
  } catch(err) {
    showToast('Chyba načítání');
  }
  renderList();
}
init();
</script>
</body>
</html>
