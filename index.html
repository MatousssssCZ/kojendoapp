<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Domů</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf7f0">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;-webkit-tap-highlight-color:transparent}
body{font-family:'Helvetica Neue',system-ui,sans-serif;background:#faf7f0;color:#1c1917;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;min-height:100dvh}
h1{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#a8a29e;margin-bottom:32px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:480px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid #e7e5e4;border-radius:24px;padding:28px 16px 24px;text-decoration:none;color:inherit;box-shadow:0 2px 16px rgba(0,0,0,.06);-webkit-tap-highlight-color:transparent;cursor:pointer}
.tile:active{transform:scale(.97)}
.tile-emoji{font-size:40px;line-height:1}
.tile-name{font-size:15px;font-weight:600;color:#1c1917;text-align:center;line-height:1.3}
.tile-sub{font-size:12px;color:#a8a29e;text-align:center}
</style>
</head>
<body>
<h1>Aplikace</h1>
<div class="grid">
  <a class="tile" href="kojendo.html">
    <div class="tile-emoji">🤱</div>
    <div class="tile-name">Kojendo</div>
  </a>
  <a class="tile" href="klubik.html">
    <div class="tile-emoji">🎬</div>
    <div class="tile-name">Mikiho klubík</div>
  </a>
</div>
</body>
</html>
